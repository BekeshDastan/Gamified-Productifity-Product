name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/prepare-release-local.mjs
      - run: node scripts/validate-release-env.mjs .data/release-local/release.env --local
      - run: docker compose --env-file .data/release-local/release.env -f deploy/compose.yaml -p ascend-release-local up -d --build --wait --wait-timeout 300
      - run: node scripts/release-smoke.mjs
      - run: node scripts/release-backup.mjs init .data/release-local/release.env ascend-release-local
      - run: node scripts/release-backup.mjs backup .data/release-local/release.env ascend-release-local
      - run: node scripts/release-backup.mjs restore-drill .data/release-local/release.env ascend-release-local
      - name: Retain redacted service diagnostics on failure
        if: failure()
        run: docker compose --env-file .data/release-local/release.env -f deploy/compose.yaml -p ascend-release-local logs --tail 80 api worker scanner
      - name: Stop isolated containers
        if: always()
        run: docker compose --env-file .data/release-local/release.env -f deploy/compose.yaml -p ascend-release-local down
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run generate:api
      - run: git diff --exit-code -- apps/web/src/lib/api/schema.d.ts
      - run: npm run check:repo
      - run: npm run format:check
      - run: npm run lint:web
      - run: npm run typecheck
      - run: npm run test:web
      - run: npm run test:tooling
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.9
          cache-dependency-path: services/api/go.sum
      - name: Verify module checksums
        run: go mod verify
      - name: Verify tidy lockfiles
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal migrations tests)"
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/api ./cmd/worker
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/api
    env:
      TEST_DATABASE_URL: postgres://ascend:ascend_ci_only@127.0.0.1:5432/ascend_test?sslmode=disable
      TEST_SMTP_ADDR: 127.0.0.1:1025
      TEST_MAIL_HTTP: http://127.0.0.1:8025
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: ascend
          POSTGRES_PASSWORD: ascend_ci_only
          POSTGRES_DB: ascend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ascend -d ascend_test"
          --health-interval=3s --health-timeout=3s --health-retries=20
      mailpit:
        image: axllent/mailpit:v1.31.5
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd="/mailpit readyz"
          --health-interval=3s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.9
          cache-dependency-path: services/api/go.sum
      - name: Reproduce SQL types
        run: |
          docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.31.1 generate
          git diff --exit-code -- internal/storage/sqlgen
      - name: PostgreSQL integration with race detector
        run: go test -race -tags=integration -count=1 ./tests/integration/...
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run build:web
        working-directory: .
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Real browser authentication with PostgreSQL and SMTP
        run: npm run test:auth-e2e
        working-directory: .
