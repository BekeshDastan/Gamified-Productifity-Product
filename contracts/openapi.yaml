openapi: 3.1.0
info:
  title: ASCEND API
  version: 0.0.0
  description: Серверная платформа. Доменные маршруты добавляются по мере реализации.
servers:
  - url: /
paths:
  /api/v1/me/onboarding:
    get:
      operationId: getOnboarding
      responses:
        "200":
          $ref: "#/components/responses/Onboarding"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
    patch:
      operationId: saveOnboarding
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "200":
          $ref: "#/components/responses/Onboarding"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/me/onboarding/complete:
    post:
      operationId: completeOnboarding
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        $ref: "#/components/requestBodies/Empty"
      responses:
        "200":
          $ref: "#/components/responses/Onboarding"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/areas:
    get:
      operationId: listareas
      responses:
        "200":
          $ref: "#/components/responses/Labels"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
    post:
      operationId: createareas
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelInput"
      responses:
        "200":
          $ref: "#/components/responses/Label"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/areas/{id}:
    patch:
      operationId: updateareas
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/IfMatch"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelInput"
      responses:
        "200":
          $ref: "#/components/responses/Label"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
    delete:
      operationId: archiveareas
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/IfMatch"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        $ref: "#/components/requestBodies/Empty"
      responses:
        "200":
          $ref: "#/components/responses/Label"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/tags:
    get:
      operationId: listtags
      responses:
        "200":
          $ref: "#/components/responses/Labels"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
    post:
      operationId: createtags
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelInput"
      responses:
        "200":
          $ref: "#/components/responses/Label"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/tags/{id}:
    patch:
      operationId: updatetags
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/IfMatch"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelInput"
      responses:
        "200":
          $ref: "#/components/responses/Label"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
    delete:
      operationId: archivetags
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/IfMatch"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        $ref: "#/components/requestBodies/Empty"
      responses:
        "200":
          $ref: "#/components/responses/Label"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/catalog/areas:
    get:
      operationId: areaCatalog
      responses:
        "200":
          description: Личные данные владельца
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LabelInput"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/me/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          $ref: "#/components/responses/Settings"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateSettings
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "200":
          $ref: "#/components/responses/Settings"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      operationId: getProfile
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProfile
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotInput"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetInput"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenInput"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/resend-verification:
    post:
      operationId: resendVerification
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        $ref: "#/components/requestBodies/Empty"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/csrf:
    get:
      operationId: getCSRF
      summary: Получить CSRF для текущей сессии или pre-auth cookie
      responses:
        "200":
          description: Токен хранится только в памяти клиента
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [token]
                    properties:
                      token:
                        type: string
                  meta:
                    $ref: "#/components/schemas/Meta"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/auth/register:
    post:
      operationId: register
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Аккаунт создан
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/Account"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      operationId: login
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          $ref: "#/components/responses/Session"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          $ref: "#/components/responses/Session"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        $ref: "#/components/requestBodies/Empty"
      responses:
        "200":
          $ref: "#/components/responses/Session"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        $ref: "#/components/requestBodies/Empty"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        $ref: "#/components/requestBodies/Empty"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      responses:
        "200":
          description: Только активные сессии текущего аккаунта
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionInfo"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        $ref: "#/components/requestBodies/Empty"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /health/live:
    get:
      operationId: getLiveness
      summary: Процесс отвечает
      responses:
        "200":
          $ref: "#/components/responses/Health"
  /health/ready:
    get:
      operationId: getReadiness
      summary: PostgreSQL доступна
      responses:
        "200":
          $ref: "#/components/responses/Health"
        "503":
          $ref: "#/components/responses/Health"
components:
  requestBodies:
    Empty:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
  responses:
    Onboarding:
      description: Личные данные владельца
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                $ref: "#/components/schemas/Onboarding"
              meta:
                $ref: "#/components/schemas/Meta"
    Label:
      description: Личные данные владельца
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                $ref: "#/components/schemas/Label"
              meta:
                $ref: "#/components/schemas/Meta"
    Labels:
      description: Личные данные владельца
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                type: array
                items:
                  $ref: "#/components/schemas/Label"
              meta:
                $ref: "#/components/schemas/Meta"
    Settings:
      description: Настройки владельца с версией
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                $ref: "#/components/schemas/Settings"
              meta:
                $ref: "#/components/schemas/Meta"
    Profile:
      description: Личный профиль владельца с версией
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                $ref: "#/components/schemas/Profile"
              meta:
                $ref: "#/components/schemas/Meta"
    OK:
      description: Операция выполнена
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
              meta:
                $ref: "#/components/schemas/Meta"
    Session:
      description: Аккаунт и метаданные сессии. Токены только в HttpOnly cookie.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                $ref: "#/components/schemas/Session"
              meta:
                $ref: "#/components/schemas/Meta"
    Health:
      description: Доступность без внутренних деталей
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthEnvelope"
    Error:
      description: Безопасная ошибка
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  parameters:
    CSRF:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
    Origin:
      in: header
      name: Origin
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
        maxLength: 1024
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  schemas:
    Starters:
      type: object
      additionalProperties: false
      required:
        - goal
        - task
        - habit
      properties:
        goal:
          type: string
          maxLength: 200
        task:
          type: string
          maxLength: 200
        habit:
          type: string
          maxLength: 200
    OnboardingInput:
      type: object
      required:
        - step
        - starters
      properties:
        step:
          type: integer
          minimum: 0
          maximum: 6
        starters:
          $ref: "#/components/schemas/Starters"
    Onboarding:
      allOf:
        - $ref: "#/components/schemas/OnboardingInput"
        - type: object
          required:
            - completed_at
            - version
            - created_at
            - updated_at
          properties:
            completed_at:
              type:
                - string
                - "null"
              format: date-time
            version:
              type: integer
              minimum: 1
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    LabelInput:
      type: object
      required:
        - name
        - color
        - icon
        - archived
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        color:
          type: string
          pattern: ^#[0-9a-f]{6}$
        icon:
          type: string
          enum:
            - book
            - briefcase
            - code
            - languages
            - activity
            - rocket
            - heart
            - sprout
            - tag
        archived:
          type: boolean
    Label:
      allOf:
        - $ref: "#/components/schemas/LabelInput"
        - type: object
          required:
            - id
            - version
            - created_at
            - updated_at
          properties:
            id:
              type: string
              format: uuid
            version:
              type: integer
              minimum: 1
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    Preferences:
      type: object
      required: [timezone, language, week_start, time_format, work_intervals, rest_days]
      properties:
        timezone:
          type: string
          maxLength: 100
          description: IANA timezone; начальная UTC, браузерная зона предлагается пользователю.
        language:
          type: string
          enum: [ru, en]
        week_start:
          type: integer
          enum: [1, 7]
        time_format:
          type: string
          enum: [24h, 12h]
        work_intervals:
          type: array
          maxItems: 28
          items:
            type: object
            additionalProperties: false
            required: [day, start, end]
            properties:
              day:
                type: integer
                minimum: 1
                maximum: 7
              start:
                type: string
                pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
              end:
                type: string
                pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        rest_days:
          type: array
          maxItems: 7
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
    Settings:
      allOf:
        - $ref: "#/components/schemas/Preferences"
        - type: object
          required: [version, created_at, updated_at]
          properties:
            version:
              type: integer
              minimum: 1
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    ProfileInput:
      type: object
      additionalProperties: false
      required: [name, nickname, avatar]
      properties:
        name:
          type: string
          maxLength: 80
        nickname:
          type: string
          pattern: "^([a-z0-9_]{3,24})?$"
        avatar:
          type: string
          enum: [mountain, compass, sprout, sun, moon, star]
    Profile:
      type: object
      additionalProperties: false
      required: [name, nickname, avatar, owner_id, version, created_at, updated_at]
      properties:
        name:
          $ref: "#/components/schemas/ProfileInput/properties/name"
        nickname:
          $ref: "#/components/schemas/ProfileInput/properties/nickname"
        avatar:
          $ref: "#/components/schemas/ProfileInput/properties/avatar"
        owner_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ForgotInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    ResetInput:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          writeOnly: true
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
    TokenInput:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          writeOnly: true
    SessionInfo:
      type: object
      additionalProperties: false
      required: [id, created_at, expires_at, remember_me, current]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        remember_me:
          type: boolean
        current:
          type: boolean
    Meta:
      type: object
      additionalProperties: false
      required: [request_id, server_time]
      properties:
        request_id:
          type: string
          maxLength: 64
        server_time:
          type: string
          format: date-time
    HealthEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              enum: [ok, unavailable]
        meta:
          $ref: "#/components/schemas/Meta"
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password, remember_me]
      description: Вход требует pre-auth CSRF и Origin. Токены выдаются только в HttpOnly cookies.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          maxLength: 128
        remember_me:
          type: boolean
    RegisterInput:
      type: object
      additionalProperties: false
      required: [email, password]
      description: Регистрация требует pre-auth CSRF и Origin; роль задаётся сервером.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128
          description: Unicode-символы, максимум 512 UTF-8 байт; пробелы сохраняются.
    Session:
      type: object
      additionalProperties: false
      required: [account, session_id, expires_at]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        session_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    Account:
      type: object
      additionalProperties: false
      required: [id, email, role, email_verified, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum:
                [
                  INVALID_JSON,
                  VALIDATION_ERROR,
                  EMAIL_TAKEN,
                  UNAUTHORIZED,
                  ORIGIN_REJECTED,
                  CSRF_REJECTED,
                  REFRESH_IN_PROGRESS,
                  TOKEN_INVALID,
                  EMAIL_UNVERIFIED,
                  FORBIDDEN,
                  NOT_FOUND,
                  METHOD_NOT_ALLOWED,
                  VERSION_CONFLICT,
                  IDEMPOTENCY_MISMATCH,
                  OPERATION_IN_PROGRESS,
                  RATE_LIMITED,
                  INTERNAL_ERROR,
                  BODY_TOO_LARGE,
                  UNSUPPORTED_MEDIA_TYPE,
                  DEADLINE_EXCEEDED,
                ]
            message:
              type: string
            request_id:
              type: string
              maxLength: 64
            fields:
              type: object
              additionalProperties:
                type: string
            current_version:
              type: integer
              minimum: 1
