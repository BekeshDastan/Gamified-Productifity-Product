openapi: 3.1.0
info:
  title: ASCEND API
  version: 0.0.0
  description: Серверная платформа. Доменные маршруты добавляются по мере реализации.
servers:
  - url: /
paths:
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotInput"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetInput"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenInput"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/resend-verification:
    post:
      operationId: resendVerification
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        $ref: "#/components/requestBodies/Empty"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/csrf:
    get:
      operationId: getCSRF
      summary: Получить CSRF для текущей сессии или pre-auth cookie
      responses:
        "200":
          description: Токен хранится только в памяти клиента
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [token]
                    properties:
                      token:
                        type: string
                  meta:
                    $ref: "#/components/schemas/Meta"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/auth/register:
    post:
      operationId: register
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Аккаунт создан
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/Account"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      operationId: login
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          $ref: "#/components/responses/Session"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          $ref: "#/components/responses/Session"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        $ref: "#/components/requestBodies/Empty"
      responses:
        "200":
          $ref: "#/components/responses/Session"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        $ref: "#/components/requestBodies/Empty"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        $ref: "#/components/requestBodies/Empty"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      responses:
        "200":
          description: Только активные сессии текущего аккаунта
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionInfo"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/Origin"
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        $ref: "#/components/requestBodies/Empty"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /health/live:
    get:
      operationId: getLiveness
      summary: Процесс отвечает
      responses:
        "200":
          $ref: "#/components/responses/Health"
  /health/ready:
    get:
      operationId: getReadiness
      summary: PostgreSQL доступна
      responses:
        "200":
          $ref: "#/components/responses/Health"
        "503":
          $ref: "#/components/responses/Health"
components:
  requestBodies:
    Empty:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
  responses:
    OK:
      description: Операция выполнена
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
              meta:
                $ref: "#/components/schemas/Meta"
    Session:
      description: Аккаунт и метаданные сессии. Токены только в HttpOnly cookie.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                $ref: "#/components/schemas/Session"
              meta:
                $ref: "#/components/schemas/Meta"
    Health:
      description: Доступность без внутренних деталей
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthEnvelope"
    Error:
      description: Безопасная ошибка
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  parameters:
    CSRF:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
    Origin:
      in: header
      name: Origin
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
        maxLength: 1024
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  schemas:
    ForgotInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    ResetInput:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          writeOnly: true
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
    TokenInput:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          writeOnly: true
    SessionInfo:
      type: object
      additionalProperties: false
      required: [id, created_at, expires_at, remember_me, current]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        remember_me:
          type: boolean
        current:
          type: boolean
    Meta:
      type: object
      additionalProperties: false
      required: [request_id, server_time]
      properties:
        request_id:
          type: string
          maxLength: 64
        server_time:
          type: string
          format: date-time
    HealthEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              enum: [ok, unavailable]
        meta:
          $ref: "#/components/schemas/Meta"
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password, remember_me]
      description: Вход требует pre-auth CSRF и Origin. Токены выдаются только в HttpOnly cookies.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          maxLength: 128
        remember_me:
          type: boolean
    RegisterInput:
      type: object
      additionalProperties: false
      required: [email, password]
      description: Регистрация требует pre-auth CSRF и Origin; роль задаётся сервером.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128
          description: Unicode-символы, максимум 512 UTF-8 байт; пробелы сохраняются.
    Session:
      type: object
      additionalProperties: false
      required: [account, session_id, expires_at]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        session_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    Account:
      type: object
      additionalProperties: false
      required: [id, email, role, email_verified, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum:
                [
                  INVALID_JSON,
                  VALIDATION_ERROR,
                  EMAIL_TAKEN,
                  UNAUTHORIZED,
                  ORIGIN_REJECTED,
                  CSRF_REJECTED,
                  REFRESH_IN_PROGRESS,
                  TOKEN_INVALID,
                  EMAIL_UNVERIFIED,
                  FORBIDDEN,
                  NOT_FOUND,
                  METHOD_NOT_ALLOWED,
                  VERSION_CONFLICT,
                  IDEMPOTENCY_MISMATCH,
                  OPERATION_IN_PROGRESS,
                  RATE_LIMITED,
                  INTERNAL_ERROR,
                  BODY_TOO_LARGE,
                  UNSUPPORTED_MEDIA_TYPE,
                  DEADLINE_EXCEEDED,
                ]
            message:
              type: string
            request_id:
              type: string
              maxLength: 64
            fields:
              type: object
              additionalProperties:
                type: string
            current_version:
              type: integer
              minimum: 1
