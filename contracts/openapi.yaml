            - tag
        archived:
          type: boolean
    Label:
      allOf:
        - $ref: "#/components/schemas/LabelInput"
        - type: object
          required:
            - id
            - version
            - created_at
            - updated_at
          properties:
            id:
              type: string
              format: uuid
            version:
              type: integer
              minimum: 1
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    Preferences:
      type: object
      required:
        - personalization
        - privacy
        - timezone
        - language
        - week_start
        - time_format
        - work_intervals
        - rest_days
      properties:
        privacy:
          type: object
          additionalProperties: false
          required:
            - profile_visibility
            - share_activity
            - share_achievements
            - discoverable
          properties:
            profile_visibility:
              type: string
              enum:
                - private
                - friends
            share_activity:
              type: boolean
              default: false
            share_achievements:
              type: boolean
              default: false
            discoverable:
              type: boolean
              default: false
        timezone:
          type: string
          maxLength: 100
          description: IANA timezone; начальная UTC, браузерная зона предлагается пользователю.
        language:
          type: string
          enum:
            - ru
            - en
        week_start:
          type: integer
          enum:
            - 1
            - 7
        time_format:
          type: string
          enum:
            - 24h
            - 12h
        work_intervals:
          type: array
          maxItems: 28
          items:
            type: object
            additionalProperties: false
            required:
              - day
              - start
              - end
            properties:
              day:
                type: integer
                minimum: 1
                maximum: 7
              start:
                type: string
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
              end:
                type: string
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        rest_days:
          type: array
          maxItems: 7
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
        personalization:
          type: object
          additionalProperties: false
          required:
            - theme
            - motion
            - sound
            - game_mode
            - widget_order
          properties:
            theme:
              type: string
              enum:
                - system
                - light
                - dark
            motion:
              type: string
              enum:
                - system
                - reduce
            sound:
              type: boolean
              default: false
            game_mode:
              type: string
              enum:
                - calm
                - standard
            widget_order:
              type: array
              minItems: 5
              maxItems: 5
              uniqueItems: true
              items:
                type: string
                enum:
                  - today
                  - calendar
                  - habits
                  - focus
                  - progress
            hidden_widgets:
              type: array
              maxItems: 5
              uniqueItems: true
              items:
                type: string
                enum:
                  - today
                  - calendar
                  - habits
                  - focus
                  - progress
    Settings:
      allOf:
        - $ref: "#/components/schemas/Preferences"
        - type: object
          required:
            - version
            - created_at
            - updated_at
          properties:
            version:
              type: integer
              minimum: 1
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    ProfileInput:
      type: object
      additionalProperties: false
      required:
        - name
        - nickname
        - avatar
      properties:
        name:
          type: string
          maxLength: 80
        nickname:
          type: string
          pattern: ^([a-z0-9_]{3,24})?$
        avatar:
          type: string
          enum:
            - mountain
            - compass
            - sprout
            - sun
            - moon
            - star
    Profile:
      type: object
      additionalProperties: false
      required:
        - name
        - nickname
        - avatar
        - owner_id
        - version
        - created_at
        - updated_at
      properties:
        name:
          $ref: "#/components/schemas/ProfileInput/properties/name"
        nickname:
          $ref: "#/components/schemas/ProfileInput/properties/nickname"
        avatar:
          $ref: "#/components/schemas/ProfileInput/properties/avatar"
        owner_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ForgotInput:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    ResetInput:
      type: object
      additionalProperties: false
      required:
        - token
        - password
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          writeOnly: true
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
    TokenInput:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          writeOnly: true
    SessionInfo:
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - expires_at
        - remember_me
        - current
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        remember_me:
          type: boolean
        current:
          type: boolean
    Meta:
      type: object
      additionalProperties: false
      required:
        - request_id
        - server_time
      properties:
        request_id:
          type: string
          maxLength: 64
        server_time:
          type: string
          format: date-time
    HealthEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - ok
                - unavailable
        meta:
          $ref: "#/components/schemas/Meta"
    LoginInput:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - remember_me
      description: Вход требует pre-auth CSRF и Origin. Токены выдаются только в HttpOnly cookies.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          maxLength: 128
        remember_me:
          type: boolean
    RegisterInput:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      description: Регистрация требует pre-auth CSRF и Origin; роль задаётся сервером.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128
          description: Unicode-символы, максимум 512 UTF-8 байт; пробелы сохраняются.
    Session:
      type: object
      additionalProperties: false
      required:
        - account
        - session_id
        - expires_at
      properties:
        account:
          $ref: "#/components/schemas/Account"
        session_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    Account:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - role
        - email_verified
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - user
            - admin
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - request_id
          properties:
            code:
              type: string
              enum:
                - INVALID_JSON
                - VALIDATION_ERROR
                - EMAIL_TAKEN
                - UNAUTHORIZED
                - ORIGIN_REJECTED
                - CSRF_REJECTED
                - REFRESH_IN_PROGRESS
                - TOKEN_INVALID
                - EMAIL_UNVERIFIED
                - FORBIDDEN
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - VERSION_CONFLICT
                - IDEMPOTENCY_MISMATCH
                - OPERATION_IN_PROGRESS
                - RATE_LIMITED
                - INTERNAL_ERROR
                - BODY_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
                - DEADLINE_EXCEEDED
            message:
              type: string
            request_id:
              type: string
              maxLength: 64
            fields:
              type: object
              additionalProperties:
                type: string
            current_version:
              type: integer
              minimum: 1
