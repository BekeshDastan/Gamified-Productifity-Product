              type: object
              additionalProperties: false
              required:
                - title
                - area_id
                - quest_id
                - all_day
                - start
                - end
                - timezone
                - reason
                - quest_version
                - cancelled
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                area_id:
                  anyOf:
                    - type: string
                      format: uuid
                    - type: "null"
                quest_id:
                  anyOf:
                    - type: string
                      format: uuid
