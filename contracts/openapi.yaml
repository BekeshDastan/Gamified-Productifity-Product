openapi: 3.1.0
info:
  title: ASCEND API
  version: 0.0.0
  description: Серверная платформа. Доменные маршруты добавляются по мере реализации.
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Процесс отвечает
      responses:
        "200":
          $ref: "#/components/responses/Health"
  /health/ready:
    get:
      operationId: getReadiness
      summary: PostgreSQL доступна
      responses:
        "200":
          $ref: "#/components/responses/Health"
        "503":
          $ref: "#/components/responses/Health"
components:
  responses:
    Health:
      description: Доступность без внутренних деталей
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthEnvelope"
    Error:
      description: Безопасная ошибка
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  parameters:
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
        maxLength: 1024
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  schemas:
    Meta:
      type: object
      additionalProperties: false
      required: [request_id, server_time]
      properties:
        request_id:
          type: string
          maxLength: 64
        server_time:
          type: string
          format: date-time
    HealthEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              enum: [ok, unavailable]
        meta:
          $ref: "#/components/schemas/Meta"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum:
                [
                  INVALID_JSON,
                  VALIDATION_ERROR,
                  UNAUTHORIZED,
                  FORBIDDEN,
                  NOT_FOUND,
                  METHOD_NOT_ALLOWED,
                  VERSION_CONFLICT,
                  IDEMPOTENCY_MISMATCH,
                  OPERATION_IN_PROGRESS,
                  RATE_LIMITED,
                  INTERNAL_ERROR,
                  BODY_TOO_LARGE,
                  UNSUPPORTED_MEDIA_TYPE,
                  DEADLINE_EXCEEDED,
                ]
            message:
              type: string
            request_id:
              type: string
              maxLength: 64
            fields:
              type: object
              additionalProperties:
                type: string
            current_version:
              type: integer
              minimum: 1
