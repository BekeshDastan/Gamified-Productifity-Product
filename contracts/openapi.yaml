openapi: 3.1.0
info:
  title: ASCEND API
  version: 0.0.0
  description: Серверная платформа. Доменные маршруты добавляются по мере реализации.
servers:
  - url: /
paths:
  /api/v1/dashboard:
    get:
      operationId: getDashboard
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Личные данные владельца
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: "#/components/schemas/Dashboard"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/plans/week:
    get:
      operationId: getPlanWeek
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
