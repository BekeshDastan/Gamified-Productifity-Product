        more_conflicts:
          type: boolean
        unfit_ids:
          type: array
          items:
            type: string
        unknown_ids:
          type: array
          items:
            type: string
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/CalendarEventDTO"
        materializing:
          type: boolean
    PlanConflict:
