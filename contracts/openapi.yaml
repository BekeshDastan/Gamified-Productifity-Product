        - priority
        - start
        - end
      properties:
        key:
          type: string
        title:
          type: string
        minutes:
          type: integer
        priority:
          type: string
          enum:
            - low
            - normal
            - high
        start:
          type: string
        end:
          type: string
    PlanAvailability:
      type: object
      additionalProperties: false
      required:
        - work_minutes
        - busy_minutes
        - free_minutes
        - scheduled_minutes
        - remaining_capacity
        - planned_minutes
        - remaining_minutes
        - deficit_minutes
        - free_slots
        - conflicts
        - more_conflicts
        - unfit_ids
        - unknown_ids
        - blocks
        - materializing
      properties:
        work_minutes:
          type: integer
        busy_minutes:
          type: integer
        free_minutes:
          type: integer
        scheduled_minutes:
          type: integer
        remaining_capacity:
          type: integer
        planned_minutes:
          type: integer
        remaining_minutes:
          type: integer
        deficit_minutes:
          type: integer
        free_slots:
          type: array
          items:
            $ref: "#/components/schemas/PlanInterval"
        conflicts:
          type: array
          items:
