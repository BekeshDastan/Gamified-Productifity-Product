  parameters:
    IfMatchSingleton:
      in: header
      name: If-Match
      required: true
      description: Версия записи; 0 только для первого создания записи на дату или вида шаблона.
      schema:
        type: string
        pattern: ^"(0|[1-9][0-9]*)"$
    CSRF:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
    Origin:
      in: header
      name: Origin
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
        maxLength: 1024
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
