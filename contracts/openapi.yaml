          type: string
        quest_version:
          type: integer
        reason:
          type: string
        start:
          type: string
        end:
          type: string
    PlanMove:
      type: object
      additionalProperties: false
      required:
        - quest_id
        - quest_version
        - reason
      properties:
        quest_id:
          type: string
        quest_version:
          type: integer
        reason:
          type: string
    PlanAmendment:
      type: object
      additionalProperties: false
      required:
        - input
        - reason
      properties:
        input:
          $ref: "#/components/schemas/PlanInput"
        reason:
          type: string
    PlanChange:
      type: object
      additionalProperties: false
      required:
        - kind
        - reason
        - at
        - before
        - after
      properties:
        kind:
          type: string
        reason:
          type: string
        at:
          type: string
        before:
          type: object
          additionalProperties: true
        after:
          type: object
          additionalProperties: true
    PlanProgress:
      type: object
      additionalProperties: false
      required:
        - committed
        - completed
        - total_weight
        - completed_weight
        - score
      properties:
        committed:
          type: integer
        completed:
          type: integer
        total_weight:
          type: integer
        completed_weight:
          type: integer
        score:
          anyOf:
            - type: integer
            - type: "null"
    DayPlan:
      type: object
      additionalProperties: false
      required:
        - available_minutes
        - windows
        - quest_ids
        - top_ids
        - rest
        - id
        - date
        - timezone
        - version
        - confirmed_at
        - snapshot
        - items
        - changes
        - progress
        - availability
      properties:
        available_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        windows:
          type: array
          items:
            $ref: "#/components/schemas/PlanWindow"
        quest_ids:
          type: array
          items:
            type: string
        top_ids:
          type: array
          maxItems: 3
          items:
            type: string
        rest:
          type: boolean
        id:
          type: string
        date:
          type: string
        timezone:
          type: string
        version:
          type: integer
        confirmed_at:
          anyOf:
            - type: string
            - type: "null"
        snapshot:
          anyOf:
            - $ref: "#/components/schemas/PlanSnapshot"
            - type: "null"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanItem"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/PlanChange"
        progress:
          $ref: "#/components/schemas/PlanProgress"
        availability:
          anyOf:
            - $ref: "#/components/schemas/PlanAvailability"
            - type: "null"
    PlanSnapshot:
      type: object
      additionalProperties: false
      required:
        - input
        - items
        - blocks
      properties:
        input:
          $ref: "#/components/schemas/PlanInput"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanItem"
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/CalendarEventDTO"
    PlanItem:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - version
        - estimated_minutes
        - weight
        - status
        - archived
        - completed_at
      properties:
        id:
          type: string
        title:
          type: string
        version:
          type: integer
        estimated_minutes:
          type: integer
        weight:
          type: integer
        status:
          type: string
        archived:
          type: boolean
        completed_at:
          anyOf:
            - type: string
            - type: "null"
    PlanInput:
      type: object
      additionalProperties: false
      required:
        - available_minutes
        - windows
        - quest_ids
        - top_ids
        - rest
      properties:
        available_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        windows:
          type: array
          items:
            $ref: "#/components/schemas/PlanWindow"
        quest_ids:
          type: array
          items:
            type: string
        top_ids:
          type: array
          maxItems: 3
          items:
            type: string
        rest:
          type: boolean
    PlanWindow:
      type: object
      additionalProperties: false
      required:
        - start
        - end
      properties:
        start:
          type: string
        end:
          type: string
    RecurrenceRule:
      type: object
      additionalProperties: false
      required:
        - frequency
        - interval
        - weekdays
        - until
        - count
      properties:
        frequency:
          type: string
          enum:
            - daily
            - weekly
            - monthly
        interval:
          type: integer
          minimum: 1
