  parameters:
    CSRF:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
    Origin:
      in: header
      name: Origin
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
        maxLength: 1024
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  schemas:
    Dashboard:
      type: object
      additionalProperties: false
      required:
        - date
        - timezone
        - plan
        - tasks
        - deadlines
        - events
        - more_tasks
        - more_deadlines
        - more_events
        - updated_at
      properties:
        date:
          type: string
        timezone:
          type: string
        plan:
          $ref: "#/components/schemas/DayPlan"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/QuestDTO"
        deadlines:
          type: array
          items:
            $ref: "#/components/schemas/QuestDTO"
        events:
          type: array
          items:
            $ref: "#/components/schemas/CalendarEventDTO"
        more_tasks:
          type: boolean
        more_deadlines:
          type: boolean
        more_events:
          type: boolean
        updated_at:
          type: string
    RoutineApply:
      type: object
      additionalProperties: false
      required:
        - start_date
        - preview_hash
        - accept_conflicts
        - reason
      properties:
        start_date:
          type: string
        preview_hash:
          type: string
        accept_conflicts:
          type: boolean
        reason:
          type: string
    RoutinePreview:
      type: object
      additionalProperties: false
      required:
        - template
        - start_date
        - days
        - hash
      properties:
        template:
          $ref: "#/components/schemas/Routine"
        start_date:
          type: string
        days:
          type: array
          items:
            $ref: "#/components/schemas/RoutinePreviewDay"
        hash:
          type: string
    RoutinePreviewDay:
      type: object
      additionalProperties: false
      required:
        - date
        - timezone
        - items
        - plan_version
        - already_applied
        - past
        - confirmed
        - input
        - actions
        - availability
      properties:
        date:
          type: string
        timezone:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanItem"
        plan_version:
          type: integer
        already_applied:
          type: boolean
        past:
          type: boolean
        confirmed:
          type: boolean
        input:
          $ref: "#/components/schemas/PlanInput"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/RoutineAction"
        availability:
          $ref: "#/components/schemas/PlanAvailability"
    Routine:
      type: object
      additionalProperties: false
      required:
        - title
        - period
        - days
        - id
        - version
      properties:
        title:
          type: string
        period:
          type: string
          enum:
            - day
            - week
        days:
          type: array
          items:
            $ref: "#/components/schemas/RoutineDay"
        id:
          type: string
        version:
          type: integer
    RoutineInput:
      type: object
      additionalProperties: false
      required:
        - title
        - period
        - days
      properties:
        title:
          type: string
        period:
          type: string
          enum:
            - day
            - week
        days:
          type: array
          items:
            $ref: "#/components/schemas/RoutineDay"
    RoutineDay:
      type: object
      additionalProperties: false
      required:
        - day
        - available_minutes
        - windows
        - rest
        - actions
      properties:
        day:
          type: integer
