version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: sqlgen
        out: internal/storage/sqlgen
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - column: users.password_hash
            go_struct_tag: 'json:"-"'
